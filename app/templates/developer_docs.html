{% extends 'base.html' %}

{% block content %}
{# 左侧为文档目录（二级/三级标题），右侧为完整文档；点击目录跳转到对应锚点。 #}
<section class="developer-docs-layout">
  <nav class="developer-docs-aside developer-docs-toc" aria-label="文档目录">
    {{ document_toc|safe }}
  </nav>
  <article class="developer-docs-content markdown-body">
    {# 插件开发规范页:提供标准示例插件下载,可直接上传安装,也可以复制后改成自己的插件。 #}
    {% if template_download %}
    <p><a class="btn" href="{{ template_download }}" download>下载标准示例插件(hello_plugin.zip)</a></p>
    {% endif %}
    {{ document_html|safe }}
  </article>
</section>
{% endblock %}
