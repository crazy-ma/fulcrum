{% extends 'base.html' %}
{% block content %}
<section class="auth-showcase">
  <div class="auth-showcase-copy">
    <p class="auth-eyebrow">平台初始化</p>
    <h1>创建首个平台管理员</h1>
    <p class="auth-lead">设置平台后台的首个管理员账号。</p>
  </div>

  <section class="login-card auth-form-card">
    <div class="section-head auth-card-head">
      <div>
        <h2>平台管理员</h2>
      </div>
    </div>
    <form method="post" action="/setup" class="form-grid" id="setup-form">
      <label><span>管理员用户名</span><input name="admin_username" required maxlength="100" value="{{ form_data.admin_username or 'admin' }}" /></label>
      <label><span>管理员显示名</span><input name="admin_display_name" required maxlength="100" value="{{ form_data.admin_display_name or '平台管理员' }}" /></label>
      <label><span>管理员密码</span><input name="admin_password" type="password" required autocomplete="new-password" /></label>
      <label><span>确认密码</span><input name="admin_password_confirm" type="password" required autocomplete="new-password" /></label>
      <div class="full-row auth-tip-panel">
        <strong>安全提示</strong>
        <p class="muted-text">密码只用于创建当前账号，不会在页面或日志中再次显示。</p>
      </div>
      <div class="full-row auth-form-actions">
        <button class="btn auth-submit" type="submit">创建平台管理员</button>
      </div>
    </form>
  </section>
</section>
{% endblock %}
