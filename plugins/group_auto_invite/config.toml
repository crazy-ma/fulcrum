[plugin]
code = "group_auto_invite"
display_name = "自动拉群"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "通过关键词邀请私聊用户加入当前机器人管理的群聊"
default_enabled = false

[capability]
# 当前只有 iPad 874 适配器实现了通用群邀请能力，其他渠道实现接口后再开放。
channel_types = ["wechat_ipad", "wechat_webridge"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 110
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["加群配置", "加群"]
require_mention = false

[runtime]
admin_user_ids = []
require_direct_chat = true
response_prefix = ""
