[plugin]
code = "supplier_order_flow"
display_name = "供应商订单收发"
plugin_type = "observer"
version = "0.2.0"
author = "Fulcrum"
description = "收发单独立系统的轻量桥接插件；业务闭环由 supplier-order-admin 通过 Fulcrum Open API/Webhook 完成。"
default_enabled = false

[capability]
channel_types = ["workwechat", "wechat_webridge"]
chat_types = ["group"]
message_types = ["text", "file"]
priority = 80
consume_policy = "continue"
timeout_ms = 3000

[matcher]
commands = ["发单", "补发单", "查询批次", "批次进度", "供应商帮助"]
keywords = ["分单ID", "快递单号"]
require_mention = false

[runtime]
supplier_order_admin_url = ""
disabled_conversation_external_ids = []
help_text = "收发单功能已迁移到独立 supplier-order-admin 系统。Fulcrum 负责企微消息网关、Open API 和 Webhook；发单、回传解析和导入请在收发单系统后台处理。"
