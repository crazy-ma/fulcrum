[plugin]
code = "weather"
display_name = "天气"
plugin_type = "rule"
version = "2.0.0"
author = "abot"
description = "天气查询与每日订阅推送"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 90
consume_policy = "continue"
timeout_ms = 30000

[ai]
# AI 调度声明：低风险，可把“北京天气怎么样”改写成 /天气 北京。
routable = true
risk = "low"
summary = "查询某个城市的天气"
examples = ["北京今天天气怎么样", "明天上海会下雨吗"]
needs_args = "城市名"

[matcher]
commands = ["天气", "订阅天气", "取消订阅"]
keywords = ["天气"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
api_base = ""
api_key = ""
default_city = "北京"
timeout_seconds = 15
daily_push_time = "08:00"
