services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-bot-saas-app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # 服务使用独立端口 8280,避免与同机其他服务冲突。
      - "8280:8280"
    env_file:
      # 验证时可用 MBS_ENV_FILE 指向样例文件，生产默认读取未提交的 .env.docker。
      - ${MBS_ENV_FILE:-.env.docker}
    environment:
      # 应用的业务时间取系统时区（见 app/core/time.py），容器必须使用北京时间，
      # 否则页面、任务和日志会按 UTC 显示，比本地晚 8 小时。
      TZ: Asia/Shanghai
    volumes:
      - ./plugins:/app/plugins
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    container_name: multi-bot-saas-mariadb
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # 生产密码只能由未提交的环境文件注入，Compose 不提供可误用的固定密码。
      MARIADB_ROOT_PASSWORD: ${MBS_DB_ROOT_PASSWORD:?请在环境中设置 MBS_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: multi_bot_saas
      MARIADB_USER: ${MBS_DB_USER:-multi_bot_saas}
      MARIADB_PASSWORD: ${MBS_DB_PASSWORD:?请在环境中设置 MBS_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - multi_bot_saas_data:/var/lib/mysql
    healthcheck:
      # 使用容器环境变量完成健康检查，避免密码直接出现在版本库和宿主机命令行中。
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  multi_bot_saas_data:
